# Four-axis controller template. Recapture the rebuilt arm before hardware use.
# Dry-run validates this template; hardware modes require confirmed calibration.
schema_version=3
calibration_confirmed=false
device=/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTA8BRX9-if00-port0
expected_board_boot_id=UNCALIBRATED
gear_ratio=6.33
motor_ids=0,1,2,3
directions=1,1,1,1
rotor_at_reference_rad=0.0,0.0,0.0,0.0
reference_joint_rad=0.0,1.7480178110996762,0.1548064706928587,0.0

# Normal operation always remains inside these soft limits. The table-supported
# calibration pose is intentionally not a valid controller startup pose.
soft_lower_rad=-2.967059728,-1.57,-2.007128640,-2.0
soft_upper_rad=2.967059728,1.57,2.007128640,2.0
hard_lower_rad=-3.141592654,-1.75,-2.62,-2.094395102
hard_upper_rad=3.141592654,1.75,2.62,2.094395102
startup_limit_margin_rad=0.05
runtime_limit_margin_rad=0.02

# Retained conservative rotor-side caps, pending four-axis hardware validation.
# These are not the motor's 23.7 Nm advertised peak output rating.
max_compensation_scale=1.0
rotor_torque_caps_nm=0.03,2.00,0.90,0.08
# Exactly two Q8 torque counts per cycle; this keeps the encoded on-wire slew
# at or below the configured bound.
rotor_torque_slew_nm_per_cycle=0.0078125
kd_rotor=0.01
# Per-joint output-side trips. The wrist thresholds allow normal hand-guided
# motion while remaining far below the motor's advertised maximum speed.
joint_speed_trip_rad_s=0.80,0.80,0.80,1.20
joint_speed_hard_trip_rad_s=1.50,1.50,1.50,2.40
joint_speed_trip_consecutive_cycles=3
rotor_feedback_torque_trip_nm=3.0
temperature_trip_c=55
control_rate_hz=100
loop_deadline_trip_s=0.05
default_ramp_s=3.0
default_duration_s=12.0
maximum_duration_s=30.0
